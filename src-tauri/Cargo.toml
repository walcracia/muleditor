[package]
name = "muleditor"
version = "0.3.3"
description = "Local-first multi-format structured document editor"
authors = ["哞-编辑器"]
license = ""
repository = "https://github.com/walcracia/muleditor"
edition = "2021"

[lib]
name = "muleditor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "muleditor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
percent-encoding = "2"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
url = "2"
