name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Check versions
        run: ./scripts/package-release.ps1 -ValidateOnly
      - name: Type check
        run: npm run check
      - name: Test Markdown rendering and export
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Install browser for UI regression
        run: npx playwright install chromium
      - name: Verify preview and downloaded HTML
        run: npm run test:e2e
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Test Rust backend
        run: cargo +stable test --locked --manifest-path src-tauri/Cargo.toml
      - name: Upload downloadable frontend build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: muleditor-web-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
